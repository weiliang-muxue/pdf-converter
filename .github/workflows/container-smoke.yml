name: Offline container smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing offline image archives
        required: true
        default: v1.1.0
      release_id:
        description: Draft release ID
        required: true
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      IMAGE_ARCH: ${{ matrix.arch }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v1\.\d+\.\d+',tag)
          name='pdf-converter-k8s-'+os.environ['IMAGE_ARCH']+'-'+tag+'.tar.gz'
          release_id=os.environ['RELEASE_ID']
          assert release_id.isdigit()
          repo='repos/weiliang-muxue/pdf-converter'
          assets=json.loads(subprocess.check_output(['gh','api',repo+'/releases/'+release_id+'/assets?per_page=100']))
          for filename in [name,name+'.sha256']:
              asset=next(a for a in assets if a['name']==filename)
              with open(filename,'wb') as destination:
                  subprocess.run(['gh','api','-H','Accept: application/octet-stream',repo+'/releases/assets/'+str(asset['id'])],stdout=destination,check=True)
          expected=pathlib.Path(name+'.sha256').read_text().split()[0]
          with open(name,'rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==expected
          print('Verified',name,expected)
          PY
      - name: Import image and build smoke client
        run: |
          docker load -i "pdf-converter-k8s-${IMAGE_ARCH}-${RELEASE_TAG}.tar.gz"
          cd 源码
          CGO_ENABLED=0 go build -mod=vendor -trimpath -o ../smoke-client ./tests/container-smoke
      - name: Test offline unprivileged container
        run: |
          docker run -d --name pdf-smoke --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912,mode=1777 \
            "pdf-converter:${RELEASE_TAG#v}-${IMAGE_ARCH}"
          docker cp smoke-client pdf-smoke:/tmp/smoke-client
          docker exec pdf-smoke /tmp/smoke-client
          docker stop --time 400 pdf-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' pdf-smoke)" = 0
      - name: Show diagnostics
        if: always()
        run: |
          docker logs pdf-smoke 2>&1 || true
          docker inspect -f '{{json .State}}' pdf-smoke || true
      - name: Remove test container
        if: always()
        run: docker rm -f pdf-smoke || true
